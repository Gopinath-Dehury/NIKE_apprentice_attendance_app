<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Manager</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; color: #333; text-align: center; }
        .box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; margin: 0 auto 25px; }
        select, input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .in { background: #4A90E2; } .out { background: #50C878; } .adm { background: #6c757d; margin-top: 10px; }
        .add-btn { background: #f39c12; width: auto; padding: 10px 20px; }
        #adminView { display: none; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); max-width: 950px; margin: 0 auto; text-align: left; }
        .scroll-table { overflow-x: auto; margin-top: 15px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; min-width: 35px; position: relative; }
        .name-col { text-align: left; min-width: 150px; font-weight: bold; position: sticky; left: 0; background: white; z-index: 2; border-right: 2px solid #ddd; }
        .p-status { color: #28a745; font-weight: bold; cursor: help; background: #effff4; }
        .a-status { color: #dc3545; opacity: 0.25; }
        .p-status:hover::after {
            content: attr(data-time); position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 6px; border-radius: 5px; white-space: nowrap; z-index: 100;
        }
    </style>
</head>
<body onload="loadStudents()">

<div class="box">
    <h2>Attendance</h2>
    <select id="studentSelect"><option value="">Loading names...</option></select>
    <button class="in" onclick="submitAttendance('checkin')">LOG CHECK IN</button>
    <button class="out" onclick="submitAttendance('checkout')">LOG CHECK OUT</button>
    <button class="adm" onclick="openAdmin()">ADMIN VIEW</button>
</div>

<div id="adminView">
    <h3 style="text-align:center">Admin Dashboard</h3>
    <div style="border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px;">
        <label><b>Manage Students:</b></label>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <input type="text" id="newUserName" placeholder="Full Name" style="margin-bottom:0">
            <button class="add-btn" onclick="addNewUser()">ADD NEW</button>
        </div>
    </div>
    <div class="scroll-table">
        <table id="gridTable"><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table>
    </div>
</div>

<script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbzWBekFACPf-cJ19ZZewxTlPYxhTmobVSzqPgTbN4Rf6Be2IIqnB35W7idUclPQc32jNA/exec";

    async function loadStudents() {
        const res = await fetch(`${APP_URL}?action=getStudents`);
        const names = await res.json();
        const select = document.getElementById('studentSelect');
        select.innerHTML = '<option value="">-- Select Your Name --</option>';
        names.forEach(n => { let o = document.createElement('option'); o.value = n; o.innerHTML = n; select.appendChild(o); });
    }

    async function submitAttendance(type) {
        const name = document.getElementById('studentSelect').value;
        if (!name) return alert("Please select a name");
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
        fetch(`${APP_URL}?name=${encodeURIComponent(name)}&action=${type}&time=${encodeURIComponent(time)}`, { mode: 'no-cors' });
        alert(`${name} recorded at ${time}`);
    }

    async function addNewUser() {
        const name = document.getElementById('newUserName').value.trim();
        if (!name) return;
        await fetch(`${APP_URL}?name=${encodeURIComponent(name)}&action=addUser`, { mode: 'no-cors' });
        alert("Added!"); document.getElementById('newUserName').value = ""; loadStudents();
    }

    function openAdmin() {
        if (prompt("Password:") === "1234") { document.getElementById('adminView').style.display = "block"; fetchGrid(); }
    }

    async function fetchGrid() {
        const tbody = document.getElementById('gridBody');
        tbody.innerHTML = "<tr><td>Loading Database...</td></tr>";
        const res = await fetch(APP_URL);
        const data = await res.json();
        const now = new Date();
        const days = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        
        let h = `<tr><th class="name-col">Name</th>`;
        for (let d = 1; d <= days; d++) h += `<th>${d}</th>`;
        document.getElementById('gridHead').innerHTML = h + `</tr>`;

        const map = {}; 
        data.slice(1).forEach(r => { 
            if(!map[r[0]]) map[r[0]] = {}; 
            map[r[0]][r[1]] = `In: ${r[2] || '--'} | Out: ${r[3] || '--'}`;
        });

        let b = "";
        Object.keys(map).sort().forEach(s => {
            b += `<tr><td class="name-col">${s}</td>`;
            for (let d = 1; d <= days; d++) {
                const date = `${now.getMonth()+1}/${d}/${now.getFullYear()}`;
                b += map[s][date] ? `<td class="p-status" data-time="${map[s][date]}">P</td>` : `<td class="a-status">A</td>`;
            }
            b += `</tr>`;
        });
        tbody.innerHTML = b;
    }
</script>
</body>
</html>
