<!DOCTYPE html>
<html>
<head>
    <title>Attendance App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .in { background: #4A90E2; } .out { background: #50C878; } .adm { background: #9B9B9B; margin-top: 15px; }
        #adminView { display: none; width: 100%; max-width: 500px; margin-top: 25px; background: white; padding: 20px; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .present { color: #28a745; font-weight: bold; }
        .absent { color: #dc3545; }
    </style>
</head>
<body>

<div class="box">
    <h2>Student Portal</h2>
    <input type="text" id="studentName" placeholder="Enter Full Name">
    <button class="in" onclick="submitAttendance('checkin')">CHECK IN</button>
    <button class="out" onclick="submitAttendance('checkout')">CHECK OUT</button>
    <button class="adm" onclick="openAdmin()">Admin Dashboard</button>
</div>

<div id="adminView">
    <h3>Monthly Report</h3>
    <table id="reportTable">
        <thead>
            <tr><th>Name</th><th>Present</th><th>Absent</th></tr>
        </thead>
        <tbody id="reportData"></tbody>
    </table>
</div>

<script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbwFgZBJn9poRH0yuh9QAdtrafV6-W8ZAsgnEJFhGf7NV1Oq3AT48gYOjHMohm8fU4J0qA/exec";

    async function submitAttendance(type) {
        const name = document.getElementById('studentName').value;
        if (!name) return alert("Please enter your name!");
        
        const time = new Date().toLocaleTimeString();
        const finalUrl = `${APP_URL}?name=${encodeURIComponent(name)}&action=${type}&time=${encodeURIComponent(time)}`;
        
        // no-cors is necessary for Google Apps Script Web Apps
        fetch(finalUrl, { mode: 'no-cors' });
        alert(`${type.toUpperCase()} recorded for ${name} at ${time}`);
    }

    function openAdmin() {
        const pw = prompt("Admin Password:");
        if (pw === "1234") fetchStats();
        else alert("Unauthorized!");
    }

    async function fetchStats() {
        const view = document.getElementById('adminView');
        const tbody = document.getElementById('reportData');
        view.style.display = "block";
        tbody.innerHTML = "Loading...";

        const response = await fetch(APP_URL);
        const data = await response.json();
        
        const totalDays = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
        const attendance = {};

        // Process data (skip header row)
        data.slice(1).forEach(row => {
            const name = row[0];
            if (!attendance[name]) attendance[name] = new Set();
            attendance[name].add(row[1]); // Column 1 is Date
        });

        tbody.innerHTML = "";
        for (const student in attendance) {
            const present = attendance[student].size;
            const absent = totalDays - present;
            tbody.innerHTML += `<tr>
                <td>${student}</td>
                <td class="present">${present}</td>
                <td class="absent">${absent}</td>
            </tr>`;
        }
    }
</script>

</body>
</html>
